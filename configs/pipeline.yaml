experiment:
  name: hrnet_rich_gallery_5090
  seed: 42
  output_dir: /workspace/outputs/hrnet_rich_gallery_5090
  resume: true
  selector_holdout_fold: 0

data:
  root: /workspace/data/BTXRD
  manifest: /workspace/data/split_manifest.csv
  image_dir: images
  table_names: [dataset.csv, dataset.xlsx]
  tumor_columns:
    - osteochondroma
    - multiple osteochondromas
    - simple bone cyst
    - giant cell tumor
    - osteofibroma
    - synovial osteochondroma
    - other bt
    - osteosarcoma
    - other mt
  tile_sizes: [512, 1024]
  tile_overlap: 0.5
  pad_multiple: 32

hrnet:
  backbone: hrnet_w48.ms_in1k
  pretrained: true
  full_long_side: 1536
  network_tile_size: 1024
  tiles_per_image: 2
  inference_tile_batch: 4
  calibration_normal_images: 128
  dense_channels: 512
  dropout: 0.1
  output_classes: 10
  topk_fractions: [0.0005, 0.002, 0.01]
  epochs: 30
  early_stopping_patience: 6
  batch_size: 1
  gradient_accumulation: 8
  backbone_lr: 1.0e-5
  head_lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 4
  normal_suppression_weight: 0.5
  full_tile_consistency_weight: 0.2
  tile_fusion_max_weight: 0.65

biomedclip:
  model_id: hf-hub:microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
  crop_fraction: 0.5
  positions_per_axis: 3
  top_k_tiles: 3
  frozen: true

proposals:
  hrnet_full_percentiles: [0.970, 0.985, 0.995]
  hrnet_tile_percentiles: [0.975, 0.990, 0.995]
  biomedclip_percentiles: [0.90, 0.95, 0.98]
  minimum_native_area: 16
  max_components_per_threshold: 5
  box_padding: [0.15, 0.40]
  positive_point_counts: [1, 3]
  negative_points: 4
  source_quotas:
    hrnet_full: 8
    hrnet_tile: 16
    biomedclip: 8

sam:
  model_type: vit_b
  checkpoint: /workspace/models/sam_vit_b_01ec64.pth
  image_size: 1024
  initial_roi_scale: 1.5
  expansion_roi_scale: 3.0
  multimask: true
  duplicate_iou: 0.98
  expansion_roi_quotas:
    hrnet_full: 4
    hrnet_tile: 8
    biomedclip: 4
  gallery_minimum_quotas:
    hrnet_full: 8
    hrnet_tile: 16
    biomedclip: 8
  maximum_raw_candidates: 80
  maximum_selected_candidates: 48
  minimum_tiny_candidates: 6
  minimum_small_candidates: 12
  tiny_area_ratio: 0.001
  small_area_ratio: 0.01
  diversity_weight: 0.20

rad_dino:
  model_id: microsoft/rad-dino
  input_size: 448
  batch_size: 16
  context_scales: [2.0, 4.0]
  selected_layers: [-9, -5, -1]
  frozen: true

g1:
  projection_dim: 128
  hidden_dim: 256
  geometry_dim: 8
  bag_temperature: 0.20
  context_radius: 2
  epochs: 20
  early_stopping_patience: 5
  learning_rate: 3.0e-4
  weight_decay: 0.01
  negative_instance_weight: 0.5
  self_guided_winner_loss: false

selection:
  hrnet_weights:
    contrast: 0.30
    purity: 0.25
    coverage: 0.20
    sam_quality: 0.15
    peak: 0.10
  biomedclip_weights:
    purity: 0.35
    contrast: 0.25
    coverage: 0.20
    sam_quality: 0.20
  source_confidence_floor: 0.50
  g1_rank_weight: 0.50
  upstream_rank_weight: 0.50
  minimum_mask_area: 4
  maximum_mask_area_ratio: 0.50
  minimum_stability: 0.50
  minimum_component_coverage: 0.25
  add_multifocal_unions: true
  maximum_union_masks: 6
  maximum_components_per_union: 3

evaluation:
  threshold: 0.5
  small_area_ratio: 0.01
  medium_area_ratio: 0.05
  save_native_maps: true
  save_stage_jsonl: true

runtime:
  device: cuda
  precision: bf16
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  maximum_dollars_per_hour: 0.60
  disk_gb: 400
