[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btxrd-native-wsss"
version = "0.1.0"
description = "Native-resolution weakly supervised bone-tumor localization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pyyaml>=6,<7",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "timm>=1.0.15,<2",
  "open_clip_torch>=2.32,<3",
  "transformers>=4.50,<5",
  "safetensors>=0.4,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
sam = ["segment-anything>=1.0", "hydra-core>=1.3,<2", "opencv-python-headless>=4.10,<5"]
train = ["accelerate>=1.2,<2", "tensorboard>=2.18,<3", "wandb>=0.19,<1"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
btxrd-wsss = "btxrd_wsss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
